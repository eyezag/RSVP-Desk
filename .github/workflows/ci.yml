name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rsvpdesk
          POSTGRES_USER: rsvpdesk
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsvpdesk -d rsvpdesk"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet tool restore
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx"
        env:
          # Enables the PostgreSQL migration test; skipped when unset.
          RSVP_TEST_POSTGRES: "Host=localhost;Database=rsvpdesk;Username=rsvpdesk;Password=ci-only"
      - name: Check migrations are up to date with the model
        run: |
          dotnet ef migrations has-pending-model-changes --project src/RsvpDesk.Web --context SqliteRsvpDbContext
          dotnet ef migrations has-pending-model-changes --project src/RsvpDesk.Web --context PostgresRsvpDbContext

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rsvp-desk:ci .
